name: Android

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  debug:
    name: Debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        # The CI build does not use the wrapper script: files pushed via
        # the API do not keep the executable bit, so the wrapper is not
        # relied on here (gradlew + its jar are still in the repo for
        # local builds).
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: c001apk-compose-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
